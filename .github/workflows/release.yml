# ═══════════════════════════════════════════════════════════════════════════
# DARKPENBOOT PRO — Release Automática (v2)
# ═══════════════════════════════════════════════════════════════════════════
#
# Dispara SÓ depois que o workflow "Build Multiplataforma" terminar.
# Assim os artefatos já estarão prontos para download.
#
# 🟣 Inspirado em NixOS — build reprodutível + verificável
# ═══════════════════════════════════════════════════════════════════════════
name: Release Automática

on:
  # ⬇️ Dispara quando o build.yml terminar (com sucesso OU falha parcial)
  workflow_run:
    workflows: ["Build Multiplataforma"]
    types: [completed]
    branches: [main, master]

  # Permite disparo manual
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    name: 🚀 Criar Release no GitHub
    runs-on: ubuntu-latest
    # Só roda se o workflow pai foi um push de tag
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Detectar tag
        id: tag
        run: |
          # Pega a tag mais recente
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "❌ Nenhuma tag encontrada"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "🔍 Tag detectada: $TAG"

      - name: 📥 Baixar Windows
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DarkPenBoot-Windows
          path: artifacts/windows/
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Baixar Linux
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DarkPenBoot-Linux
          path: artifacts/linux/
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Baixar macOS
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DarkPenBoot-macOS
          path: artifacts/macos/
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Baixar Android
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DarkPenBoot-Android
          path: artifacts/android/
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Listar arquivos
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Arquivos prontos para Release"
          echo "═══════════════════════════════════════════════"
          find artifacts -type f -exec ls -lh {} \; 2>/dev/null || echo "(vazio)"

      - name: 🚀 Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "DarkPenBoot Pro ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # 🚀 DarkPenBoot Pro ${{ steps.tag.outputs.tag }}

            ## 📦 Downloads

            | Plataforma | Arquivo |
            |-----------|---------|
            | 🪟 Windows | `DarkPenBoot.exe` |
            | 🐧 Linux | `darkpenboot` |
            | 🍏 macOS | `DarkPenBoot` |
            | 📱 Android | `darkpenboot-*.apk` (em breve) |

            ## 🔐 Verificar SHA256

            ```bash
            sha256sum -c darkpenboot.sha256